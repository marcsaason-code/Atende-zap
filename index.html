<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atende +Zap</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #22c55e;
    --green-dark: #16a34a;
    --green-light: #dcfce7;
    --green-mid: #86efac;
    --blue: #3b82f6;
    --blue-light: #eff6ff;
    --blue-mid: #93c5fd;
    --bg: #f0f4f8;
    --bg2: #ffffff;
    --bg3: #f8fafc;
    --border: #e2e8f0;
    --border2: #cbd5e1;
    --text: #0f172a;
    --text2: #64748b;
    --text3: #94a3b8;
    --danger: #ef4444;
    --warn: #f59e0b;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow: 0 4px 16px rgba(15,23,42,0.08), 0 1px 4px rgba(15,23,42,0.04);
    --shadow-lg: 0 10px 40px rgba(15,23,42,0.12);
  }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }
  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }
  button { cursor: pointer; font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .fade-in { animation: fadeIn 0.15s ease both; }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 50%, #f8fafc 100%); position: relative; overflow: hidden; }
  .login-bg { position: absolute; inset: 0; pointer-events: none; }
  .login-card { width: 400px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 44px 40px; position: relative; z-index: 1; box-shadow: var(--shadow-lg); }
  .login-logo { display: flex; align-items: center; gap: 11px; margin-bottom: 8px; }
  .login-logo-icon { width: 46px; height: 46px; background: var(--green); border-radius: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
  .login-logo-icon svg { width: 26px; height: 26px; fill: #fff; }
  .login-logo h1 { font-size: 22px; color: var(--text); font-weight: 700; }
  .login-logo span { font-size: 22px; color: var(--green); font-weight: 700; }
  .login-sub { font-size: 13px; color: var(--text2); margin-bottom: 32px; line-height: 1.6; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  .field input { width: 100%; background: var(--bg3); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text); font-size: 14px; outline: none; transition: border 0.2s, box-shadow 0.2s; }
  .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
  .btn-primary { width: 100%; padding: 13px; background: var(--green); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px; border: none; border-radius: var(--radius-sm); transition: all 0.2s; box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
  .btn-primary:hover { background: var(--green-dark); box-shadow: 0 6px 16px rgba(34,197,94,0.35); transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .login-note { margin-top: 20px; font-size: 12px; color: var(--text3); text-align: center; }

  /* Layout */
  .app-layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 228px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: var(--shadow-sm); transition: width 0.25s ease, transform 0.25s ease; position: relative; z-index: 50; }
  .sidebar.collapsed { width: 64px; }
  .sidebar-logo { padding: 22px 20px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
  .sidebar-logo-icon { width: 34px; height: 34px; background: var(--green); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 3px 8px rgba(34,197,94,0.25); }
  .sidebar-logo-icon svg { width: 19px; height: 19px; fill: #fff; }
  .sidebar-logo span { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); transition: opacity 0.2s; }
  .sidebar-logo em { color: var(--green); font-style: normal; }
  .sidebar.collapsed .sidebar-logo span { opacity: 0; width: 0; overflow: hidden; }
  .sidebar-nav { flex: 1; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: 10px; cursor: pointer; transition: all 0.15s; color: var(--text2); font-size: 15px; font-weight: 500; border: none; background: none; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--green-light); color: var(--green-dark); font-weight: 600; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .nav-label { transition: opacity 0.2s, width 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; overflow: hidden; display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }
  .sidebar-bottom { padding: 12px 8px; border-top: 1px solid var(--border); }
  .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg3); overflow: hidden; }
  .sidebar.collapsed .sidebar-user { justify-content: center; padding: 8px; }
  .sidebar.collapsed .user-info, .sidebar.collapsed .logout-btn { display: none; }
  .user-avatar { width: 32px; height: 32px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--green-dark); flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-cnpj { font-size: 11px; color: var(--text3); }
  .logout-btn { background: none; border: none; padding: 4px; color: var(--text3); border-radius: 4px; flex-shrink: 0; }
  .logout-btn:hover { color: var(--danger); }
  .sidebar-toggle { position: absolute; top: 22px; right: -14px; width: 28px; height: 28px; background: var(--bg2); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); z-index: 10; transition: all 0.2s; }
  .sidebar-toggle:hover { background: var(--green-light); border-color: var(--green-mid); }
  .sidebar-toggle svg { transition: transform 0.25s; }
  .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

  /* Mobile overlay */
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 40; backdrop-filter: blur(2px); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; gap: 12px; }
  .topbar h2 { font-size: 18px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .mobile-menu-btn { display: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .mobile-menu-btn:hover { background: var(--bg3); }
  .page-content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; }

  /* Responsive breakpoints */
  @media (max-width: 900px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    .dash-bottom { grid-template-columns: 1fr; }
    .status-bar { grid-template-columns: repeat(3,1fr); }
    .cal-layout { grid-template-columns: 1fr; }
    .suporte-layout { grid-template-columns: 1fr; }
    .suporte-sidebar { display: none; }
  }
  @media (max-width: 768px) {
    .sidebar { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); width: 228px !important; z-index: 50; }
    .sidebar.mobile-open { transform: translateX(0); }
    .sidebar-overlay { display: block; }
    .sidebar-toggle { display: none; }
    .mobile-menu-btn { display: flex; }
    .main { width: 100%; }
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric-card { padding: 14px 14px; }
    .metric-card-icon { width: 32px; height: 32px; margin-bottom: 10px; }
    .metric-value { font-size: 24px; }
    .metric-trend { font-size: 10px; padding: 1px 6px; }
    .status-bar { grid-template-columns: repeat(3,1fr); gap: 8px; }
    .status-pill { padding: 10px 10px; gap: 6px; }
    .status-pill-val { font-size: 16px; }
    .status-pill-label { font-size: 11px; }
    .dash-bottom { grid-template-columns: 1fr; }
    .dash-card-title { font-size: 13px; }
    .activity-item { padding: 10px 14px; gap: 10px; }
    .sched-item { padding: 10px 14px; }
    .page-content { padding: 14px; }
    .topbar { padding: 12px 16px; }
    .topbar h2 { font-size: 16px; }
    .cal-layout { grid-template-columns: 1fr; }
    .dash-greeting h3 { font-size: 18px; }
    .section-title { font-size: 13px; }
  }
  @media (max-width: 480px) {
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-card { padding: 12px 12px; }
    .metric-card-icon { width: 28px; height: 28px; margin-bottom: 8px; border-radius: 8px; }
    .metric-card-icon svg { width: 15px; height: 15px; }
    .metric-value { font-size: 22px; }
    .metric-label { font-size: 11px; }
    .metric-sub { font-size: 10px; }
    .metric-trend { font-size: 9px; top: 10px; right: 10px; }
    .status-bar { grid-template-columns: repeat(3,1fr); gap: 6px; }
    .status-pill { padding: 8px 8px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .status-pill-label { font-size: 10px; }
    .status-pill-val { font-size: 18px; }
    .form-row { grid-template-columns: 1fr; }
    .hide-sm { display: none !important; }
    .dash-greeting { margin-bottom: 16px; }
    .dash-greeting h3 { font-size: 17px; }
    .page-content { padding: 12px; }
    .activity-avatar { width: 30px; height: 30px; font-size: 10px; }
    .activity-name { font-size: 12px; }
    .activity-msg { font-size: 11px; }
    .sched-name { font-size: 12px; }
    .sched-sub { font-size: 10px; }
    .sched-time { font-size: 12px; }
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-novo { background: var(--blue); animation: pulse 2s infinite; }
  .dot-atendendo { background: var(--warn); animation: pulse 2s infinite; }
  .dot-finalizado { background: var(--green); }

  /* Dashboard — novo layout */
  .dash-greeting { margin-bottom: 24px; }
  .dash-greeting h3 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .dash-greeting p { font-size: 14px; color: var(--text2); }
  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; }
  .metric-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .metric-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .metric-card-icon svg { width: 20px; height: 20px; }
  .metric-card-icon.blue { background: var(--blue-light); color: var(--blue); }
  .metric-card-icon.green { background: var(--green-light); color: var(--green-dark); }
  .metric-card-icon.warn { background: #fffbeb; color: var(--warn); }
  .metric-card-icon.gray { background: #f1f5f9; color: #475569; }
  .metric-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
  .metric-value { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 700; color: var(--text); line-height: 1; }
  .metric-sub { font-size: 12px; color: var(--text3); margin-top: 5px; }
  .metric-trend { position: absolute; top: 18px; right: 18px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .metric-trend.up { background: var(--green-light); color: var(--green-dark); }
  .metric-trend.warn { background: #fffbeb; color: #92400e; }

  /* Dashboard barra de status */
  .status-bar { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
  .status-pill { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm); }
  .status-pill-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-pill-label { font-size: 13px; color: var(--text2); flex: 1; }
  .status-pill-val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); }

  /* Dashboard grid inferior */
  .dash-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .dash-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .dash-card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dash-card-title { font-size: 13px; font-weight: 500; letter-spacing: 0.01em; color: var(--text); }
  .dash-card-link { font-size: 12px; color: var(--green-dark); font-weight: 500; background: none; border: none; cursor: pointer; }
  .dash-card-link:hover { text-decoration: underline; }

  /* Activity feed */
  .activity-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); transition: background 0.12s; }
  .activity-item:last-child { border-bottom: none; }
  .activity-item:hover { background: var(--bg3); }
  .activity-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .activity-avatar.blue { background: var(--blue-light); color: var(--blue); }
  .activity-avatar.green { background: var(--green-light); color: var(--green-dark); }
  .activity-avatar.warn { background: #fffbeb; color: #92400e; }
  .activity-info { flex: 1; min-width: 0; }
  .activity-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity-msg { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity-time { font-size: 11px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }

  /* Agendamento lateral */
  .sched-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .sched-item:last-child { border-bottom: none; }
  .sched-time-box { width: 44px; text-align: center; flex-shrink: 0; }
  .sched-time { font-size: 13px; font-weight: 700; color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; }
  .sched-ampm { font-size: 10px; color: var(--text3); }
  .sched-divider { width: 1px; height: 32px; background: var(--border2); flex-shrink: 0; }
  .sched-info { flex: 1; }
  .sched-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .sched-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }

  /* Table */
  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); background: var(--bg3); }
  td { padding: 13px 16px; font-size: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg3); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .badge-novo { background: #eff6ff; color: #1d4ed8; }
  .badge-atendendo { background: #fffbeb; color: #92400e; }
  .badge-finalizado { background: var(--green-light); color: var(--green-dark); }

  /* Atendimentos */
  .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 16px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 14px; font-weight: 500; transition: all 0.15s; box-shadow: var(--shadow-sm); }
  .filter-btn:hover { border-color: var(--green-mid); color: var(--text); }
  .filter-btn.active { background: var(--green-light); border-color: var(--green-mid); color: var(--green-dark); font-weight: 600; }
  .chat-row { display: flex; align-items: flex-start; gap: 12px; }
  .chat-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-light); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--blue); flex-shrink: 0; }
  .chat-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .chat-msg { font-size: 13px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .chat-time { font-size: 13px; color: var(--text3); white-space: nowrap; }
  .action-btn { padding: 6px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .action-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

  .btn-add { display: flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; transition: all 0.2s; box-shadow: 0 3px 10px rgba(34,197,94,0.25); }
  .btn-add:hover { background: var(--green-dark); box-shadow: 0 4px 14px rgba(34,197,94,0.35); transform: translateY(-1px); }

  /* Calendário */
  .cal-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .cal-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .cal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--text2); display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .cal-nav-btn:hover { background: var(--green-light); color: var(--green-dark); border-color: var(--green-mid); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow { font-size: 11px; font-weight: 600; color: var(--text3); text-align: center; padding: 10px 0; text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg3); }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px 4px; cursor: pointer; border-top: 1px solid var(--border); position: relative; transition: background 0.12s; gap: 3px; min-height: 52px; }
  .cal-day:hover { background: var(--bg3); }
  .cal-day.other-month .cal-day-num { opacity: 0.3; }
  .cal-day.today .cal-day-num { background: var(--green); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .cal-day.selected { background: var(--blue-light); }

/* ═══════════════════════════════════════════════════════
   APP PRINCIPAL
═══════════════════════════════════════════════════════ */
function App() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('atende_user') || 'null'); } catch { return null; }
  });

  // Ao restaurar sessão do localStorage, verifica status do WA e carrega dados
  useEffect(() => {
    if (user) {
      checkWaStatus(user);
      loadData(user.cnpj);
    }
  }, []);
  const [page, setPage] = useState('dashboard');
  const [toasts, setToasts] = useState([]);
  const [atendimentos, setAtendimentos] = useState([]);
  const [agendamentos, setAgendamentos] = useState([]);
  const [funcionarios, setFuncionarios] = useState([]);
  const [categorias, setCategorias] = useState([]);
  const [servicos, setServicos] = useState([]);
  const [waStatus, setWaStatus] = useState(() => {
    // Inicializa do banco logo após — começa como 'verificando'
    return 'verificando';
  });
  const [loading, setLoading] = useState(false);

  const addToast = useCallback((msg, type = 'success') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  }, []);

  /* Carrega dados do Supabase após login */
  const loadData = useCallback(async (cnpj, silent = false) => {
    if (!silent) setLoading(true);
    try {
      const [{ data: ats }, { data: ags }, { data: funcs }, { data: cats }, { data: servs }] = await Promise.all([
        sb.from('atendimentos').select('*').eq('cnpj', cnpj).order('created_at', { ascending: false }),
        sb.from('agendamentos').select('*').eq('cnpj', cnpj).order('data', { ascending: true }),
        sb.from('funcionarios').select('*').eq('cnpj', cnpj).order('nome'),
        sb.from('categorias').select('*').eq('cnpj', cnpj).order('nome'),
        sb.from('servicos').select('*').eq('cnpj', cnpj).order('nome'),
      ]);
      if (ats?.length) setAtendimentos(prev => {
        const prevStr = JSON.stringify(prev);
        const newStr = JSON.stringify(ats);
        return prevStr === newStr ? prev : ats;
      }); else if (!silent) setAtendimentos(mockAtendimentos);
      if (ags?.length) setAgendamentos(prev => {
        const prevStr = JSON.stringify(prev);
        const newStr = JSON.stringify(ags);
        return prevStr === newStr ? prev : ags;
      }); else if (!silent) setAgendamentos(mockAgendamentos);
      if (funcs) setFuncionarios(funcs);
      if (cats) setCategorias(cats);
      if (servs) setServicos(servs);
    } catch {
      if (!silent) {
        setAtendimentos(mockAtendimentos);
        setAgendamentos(mockAgendamentos);
        addToast('Usando dados offline', 'info');
      }
    }
    if (!silent) setLoading(false);
  }, [addToast]);

  /* Verifica estado da instância Evolution ao logar */
  const checkWaStatus = useCallback(async (userData) => {
    if (!userData.cnpj) { setWaStatus('desconectado'); return; }
    try {
      const { data } = await sb.from('usuarios').select('wa_status').eq('cnpj', userData.cnpj).single();
      setWaStatus(data?.wa_status === 'conectado' ? 'conectado' : 'desconectado');
    } catch {
      setWaStatus('desconectado');
    }
  }, []);

  const handleLogin = async (userData) => {
    // Remove senha antes de salvar no localStorage
    const { senha: _, ...userSafe } = userData;
    setUser(userSafe);
    localStorage.setItem('atende_user', JSON.stringify(userSafe));
    await loadData(userSafe.cnpj);
    await checkWaStatus(userSafe);
    addToast(`Bem-vindo, ${userSafe.nome}!`);
  };

  const handleLogout = () => {
    try { sb.from('logs_acesso').insert([{ cnpj: user?.cnpj, tipo:'cliente', evento:'logout' }]); } catch {}
    setUser(null);
    localStorage.removeItem('atende_user');
    // Limpa quaisquer chaves wa_status antigas
    Object.keys(localStorage).filter(k => k.startsWith('wa_status')).forEach(k => localStorage.removeItem(k));
    setAtendimentos([]);
    setAgendamentos([]);
    setFuncionarios([]);
    setCategorias([]);
    setServicos([]);
    setWaStatus('desconectado');
  };

  /* Polling silencioso de atendimentos a cada 30s — sem piscar */
  useEffect(() => {
    if (!user) return;
    const interval = setInterval(() => loadData(user.cnpj, true), 30000);
    return () => clearInterval(interval);
  }, [user, loadData]);

  /* Realtime — atualiza atendimentos instantaneamente sem piscar */
  useEffect(() => {
    if (!user?.cnpj) return;
    const channel = sb.channel(`atendimentos:${user.cnpj}`)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'atendimentos',
        filter: `cnpj=eq.${user.cnpj}`
      }, payload => {
        if (payload.eventType === 'INSERT') {
          setAtendimentos(p => p.some(a => a.id === payload.new.id) ? p : [payload.new, ...p]);
        } else if (payload.eventType === 'UPDATE') {
          setAtendimentos(p => p.map(a => a.id === payload.new.id ? payload.new : a));
        } else if (payload.eventType === 'DELETE') {
          setAtendimentos(p => p.filter(a => a.id !== payload.old.id));
        }
      })
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [user?.cnpj]);

  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [sidebarMobileOpen, setSidebarMobileOpen] = useState(false);
  const isMobile = () => window.innerWidth <= 768;

  const toggleSidebar = () => {
    if (isMobile()) setSidebarMobileOpen(p => !p);
    else setSidebarCollapsed(p => !p);
  };
  const closeMobile = () => setSidebarMobileOpen(false);

  if (!user) return <LoginPage onLogin={handleLogin} addToast={addToast} />;

  if (loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',flexDirection:'column',gap:16}}>
      <div className="spinner" style={{width:48,height:48,borderWidth:4}}/>
      <p style={{color:'var(--text2)',fontSize:14}}>Carregando dados...</p>
    </div>
  );

  return (
    <div className="app-layout">
      {/* Overlay mobile */}
      {sidebarMobileOpen && <div className="sidebar-overlay" onClick={closeMobile}/>}

      <Sidebar
        page={page} setPage={(p) => { setPage(p); closeMobile(); }}
        user={user} onLogout={handleLogout}
        collapsed={sidebarCollapsed}
        mobileOpen={sidebarMobileOpen}
        onToggle={toggleSidebar}
      />
      <div className="main">
        <Topbar page={page} waStatus={waStatus} onMenuClick={toggleSidebar} />
        <div className={`page-content`} style={page==='whatsapp'?{padding:0,overflow:'hidden'}:{}}>
          <div style={{display: page==='dashboard'?'block':'none'}}><Dashboard atendimentos={atendimentos} agendamentos={agendamentos} setPage={setPage} funcionarios={funcionarios} /></div>
          <div style={{display: page==='atendimentos'?'block':'none'}}><Atendimentos data={atendimentos} setData={setAtendimentos} addToast={addToast} agendamentos={agendamentos} setAgendamentos={setAgendamentos} user={user} funcionarios={funcionarios} categorias={categorias} servicos={servicos} /></div>
          <div style={{display: page==='agenda'?'block':'none'}}><Agenda data={agendamentos} setData={setAgendamentos} addToast={addToast} user={user} funcionarios={funcionarios} categorias={categorias} servicos={servicos} /></div>
          <div style={{display: page==='whatsapp'?'block':'none', height: page==='whatsapp'?'100%':'0'}}><WhatsApp status={waStatus} setStatus={setWaStatus} user={user} addToast={addToast} /></div>
          <div style={{display: page==='suporte'?'block':'none'}}><Suporte user={user} addToast={addToast} /></div>
          <div style={{display: page==='configuracoes'?'block':'none'}}><Configuracoes user={user} funcionarios={funcionarios} setFuncionarios={setFuncionarios} categorias={categorias} setCategorias={setCategorias} servicos={servicos} setServicos={setServicos} addToast={addToast} /></div>
        </div>
      </div>
      <ToastManager toasts={toasts} />
    </div>
  );
}

/* ═══ LOGIN ═══ */
function LoginPage({ onLogin, addToast }) {
  const [cnpj, setCnpj] = useState('');
  const [senha, setSenha] = useState('');
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState('');

  const formatCNPJ = (v) => {
    const d = v.replace(/\D/g, '').slice(0, 14);
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
      .replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    setErro('');
    if (!cnpj || !senha) { setErro('Preencha o CNPJ e a senha.'); return; }
    setLoading(true);
    try {
      // Usa função segura do banco: hash + rate limit + log
      const { data, error } = await sb.rpc('login_cliente', {
        p_cnpj: cnpj,
        p_senha: senha,
      });

      if (error) {
        setErro('Erro de conexão. Verifique sua internet.');
      } else if (data?.erro) {
        setErro(data.erro);
      } else {
        onLogin(data);
      }
    } catch {
      setErro('Erro de conexão. Verifique sua internet.');
    }
    setLoading(false);
  };

  return (
    <div className="login-wrap">
      <div className="login-bg">
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%'}} viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="g1" cx="30%" cy="20%" r="50%"><stop offset="0%" stopColor="#bbf7d0" stopOpacity="0.6"/><stop offset="100%" stopColor="transparent"/></radialGradient>
            <radialGradient id="g2" cx="80%" cy="70%" r="50%"><stop offset="0%" stopColor="#bfdbfe" stopOpacity="0.5"/><stop offset="100%" stopColor="transparent"/></radialGradient>
          </defs>
          <rect width="1200" height="800" fill="url(#g1)"/>
          <rect width="1200" height="800" fill="url(#g2)"/>
          <circle cx="100" cy="100" r="180" fill="#dcfce7" opacity="0.4"/>
          <circle cx="1100" cy="700" r="220" fill="#dbeafe" opacity="0.4"/>
          <circle cx="600" cy="750" r="120" fill="#dcfce7" opacity="0.25"/>
        </svg>
      </div>
      <div className="login-card fade-in">
        <div className="login-logo">
          <img src="/assets/logo.png" alt="Atende+Zap" style={{height:64,objectFit:'contain'}}/>
        </div>
        <p className="login-sub">Acesse sua plataforma de atendimento via WhatsApp com IA. Credenciais fornecidas pelo suporte.</p>
        <form onSubmit={handleLogin}>
          <div className="field">
            <label>CNPJ</label>
            <input placeholder="00.000.000/0000-00" value={cnpj} onChange={e => setCnpj(formatCNPJ(e.target.value))} />
          </div>
          <div className="field">
            <label>Senha</label>
            <input type="password" placeholder="••••••••" value={senha} onChange={e => setSenha(e.target.value)} />
          </div>
          {erro && (
            <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'10px 14px',fontSize:13,color:'var(--danger)',marginBottom:16}}>
              {erro}
            </div>
          )}
          <button className="btn-primary" type="submit" disabled={loading}>
            {loading ? 'Verificando...' : 'Entrar na plataforma'}
          </button>
        </form>
        <p className="login-note">Problemas de acesso? Contate o suporte técnico</p>
      </div>
    </div>
  );
}

/* ═══ SIDEBAR ═══ */
function Sidebar({ page, setPage, user, onLogout, collapsed, mobileOpen, onToggle }) {
  const items = [
    { id: 'dashboard', label: 'Dashboard', icon: <IconDash /> },
    { id: 'atendimentos', label: 'Atendimentos', icon: <IconChat /> },
    { id: 'agenda', label: 'Agenda', icon: <IconCal /> },
    { id: 'whatsapp', label: 'WhatsApp', icon: <div style={{width:18,height:18,flexShrink:0}}><IconWA /></div> },
    { id: 'suporte', label: 'Suporte', icon: <IconSuport /> },
    { id: 'configuracoes', label: 'Configurações', icon: <IconConfig /> },
  ];

  const cls = ['sidebar', collapsed ? 'collapsed' : '', mobileOpen ? 'mobile-open' : ''].filter(Boolean).join(' ');

  return (
    <div className={cls}>
      {/* Botão colapsar (desktop) */}
      <button className="sidebar-toggle" onClick={onToggle} title={collapsed ? 'Expandir menu' : 'Recolher menu'}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div className="sidebar-logo">
        <img src="/assets/logo.png" alt="Atende+Zap" style={{height:42,objectFit:'contain',maxWidth:180}}/>
      </div>

      <nav className="sidebar-nav">
        {items.map(item => (
          <button
            key={item.id}
            className={`nav-item ${page === item.id ? 'active' : ''}`}
            onClick={() => setPage(item.id)}
            title={collapsed ? item.label : ''}
          >
            {item.icon}
            <span className="nav-label">{item.label}</span>
          </button>
        ))}
      </nav>

      <div className="sidebar-bottom">
        <div className="sidebar-user">
          <div className="user-avatar">{user.initials || (user.nome?.slice(0,2).toUpperCase())}</div>
          <div className="user-info">
            <div className="user-name">{user.nome}</div>
            <div className="user-cnpj">{user.cnpj?.slice(0,18)}</div>
          </div>
          <button className="logout-btn" onClick={onLogout} title="Sair"><IconLogout /></button>
        </div>
      </div>
    </div>
  );
}

/* ═══ DASHBOARD ═══ */
function Dashboard({ atendimentos, agendamentos, setPage, funcionarios }) {
  const [chartFiltro, setChartFiltro] = useState('mes');
  const hoje = new Date().toISOString().slice(0, 10);
  const total = atendimentos.length;
  const novos = atendimentos.filter(a => a.status === 'novo').length;
  const atendendo = atendimentos.filter(a => a.status === 'atendendo').length;
  const finalizados = atendimentos.filter(a => a.status === 'finalizado').length;
  const agHoje = agendamentos.filter(a => a.data === hoje);
  const agConcluidos = agendamentos.filter(a => a.status === 'confirmado').length;

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';

  const IconMsg = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>;
  const IconCheck2 = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>;
  const IconLoader = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
  const IconCalSmall = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;

  const taxaResolucao = total > 0 ? Math.round((finalizados / total) * 100) : 0;

  const cardStyle = { cursor: 'pointer', transition: 'box-shadow 0.18s, transform 0.18s' };
  const cardHover = (e) => { e.currentTarget.style.boxShadow = 'var(--shadow)'; e.currentTarget.style.transform = 'translateY(-3px)'; };
  const cardLeave = (e) => { e.currentTarget.style.boxShadow = 'var(--shadow-sm)'; e.currentTarget.style.transform = 'translateY(-2px)'; };

  return (
    <div>
      <div className="dash-greeting">
        <h3>{saudacao}!</h3>
        <p>Aqui está o resumo dos atendimentos de hoje.</p>
      </div>

      {/* Cards principais — todos clicáveis → Atendimentos */}
      <div className="metrics-grid">
        {[
          { icon: <IconMsg/>, cls:'blue', label:'Atendimentos hoje', val:total, sub:'Total recebidos', trend:`+${total} hoje`, trendCls:'up', page:'atendimentos' },
          { icon: <IconLoader/>, cls:'warn', label:'Em andamento', val:atendendo, sub:'Aguardando resposta', trend:atendendo>0?`${atendendo} ativo${atendendo>1?'s':''}`:null, trendCls:'warn', page:'atendimentos' },
          { icon: <IconCheck2/>, cls:'green', label:'Finalizados', val:finalizados, sub:`Taxa: ${taxaResolucao}% de resolução`, trend:`${taxaResolucao}% ✓`, trendCls:'up', page:'atendimentos' },
          { icon: <IconCalSmall/>, cls:'gray', label:'Agend. confirmados', val:agConcluidos, sub:`${agHoje.length} agendado${agHoje.length!==1?'s':''} para hoje`, trend:null, page:'agenda' },
        ].map((c,i) => (
          <div key={i} className="metric-card" style={cardStyle}
            onClick={() => setPage(c.page)}
            onMouseEnter={cardHover} onMouseLeave={cardLeave}
            title={`Ir para ${c.page}`}>
            <div className={`metric-card-icon ${c.cls}`}>{c.icon}</div>
            <div className="metric-label">{c.label}</div>
            <div className="metric-value">{c.val}</div>
            <div className="metric-sub">{c.sub}</div>
            {c.trend && <span className={`metric-trend ${c.trendCls}`}>{c.trend}</span>}
            <div style={{position:'absolute',bottom:12,right:14,fontSize:10,color:'var(--text3)',opacity:.6}}>→</div>
          </div>
        ))}
      </div>

      {/* Barra de status — clicável → Atendimentos */}
      <div className="status-bar">
        {[
          { dot:'dot-novo', label:'Novos', val:novos },
          { dot:'dot-atendendo', label:'Em atendimento', val:atendendo },
          { dot:'dot-finalizado', label:'Finalizados', val:finalizados },
        ].map((p,i) => (
          <div key={i} className="status-pill" style={{cursor:'pointer',transition:'background .15s'}}
            onClick={() => setPage('atendimentos')}
            onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
            onMouseLeave={e=>e.currentTarget.style.background=''}>
            <span className={`status-pill-dot ${p.dot}`} />
            <span className="status-pill-label">{p.label}</span>
            <span className="status-pill-val">{p.val}</span>
          </div>
        ))}
      </div>

      {/* ── Gráficos lado a lado ── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:24}}>

        {/* Gráfico de colunas: atendimentos do mês por status */}
        {(() => {
          const agora = new Date();
          const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1);
          const doMes = atendimentos.filter(a => a.created_at && new Date(a.created_at) >= inicioMes);
          const statusConfig = [
            { key: 'novo',       label: 'Novo',       color: '#3b82f6' },
            { key: 'atendendo',  label: 'Atendendo',  color: '#f59e0b' },
            { key: 'pendente',   label: 'Pendente',   color: '#8b5cf6' },
            { key: 'agendado',   label: 'Agendado',   color: '#0891b2' },
            { key: 'finalizado', label: 'Finalizado', color: '#22c55e' },
          ];
          const counts = statusConfig.map(s => ({ ...s, val: doMes.filter(a => a.status === s.key).length }));
          const max = Math.max(...counts.map(c => c.val), 1);
          const total = counts.reduce((acc, c) => acc + c.val, 0);
          const mesNome = agora.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          const chartH = 140;

          return (
            <div className="dash-card" style={{margin:0}}>
              <div className="dash-card-header">
                <span className="dash-card-title">Atendimentos — {mesNome}</span>
                <span style={{fontSize:11,color:'var(--text3)',fontWeight:500}}>{total} total</span>
              </div>
              <div style={{padding:'16px 16px 12px'}}>
                {total === 0 ? (
                  <div style={{textAlign:'center',color:'var(--text3)',fontSize:13,padding:'24px 0'}}>Nenhum atendimento este mês</div>
                ) : (
                  <>
                    <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-around',height:chartH,gap:4}}>
                      {counts.map(({ key, label, color, val }) => {
                        const pct = max > 0 ? (val / max) : 0;
                        const barH = Math.max(pct * chartH, val > 0 ? 8 : 0);
                        return (
                          <div key={key} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flex:1}}>
                            <span style={{fontSize:12,fontWeight:700,color:'var(--text)',minHeight:18,textAlign:'center'}}>{val > 0 ? val : ''}</span>
                            <div style={{width:'100%',height:chartH - 18,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
                              <div style={{width:'65%',height:barH,background:color,borderRadius:'5px 5px 2px 2px',transition:'height .6s ease',boxShadow:val>0?`0 3px 10px ${color}40`:'none',position:'relative'}}>
                                {val > 0 && <div style={{position:'absolute',top:0,left:0,right:0,height:5,background:'rgba(255,255,255,0.25)',borderRadius:'5px 5px 0 0'}}/>}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{height:1,background:'var(--border)',margin:'8px 0'}}/>
                    <div style={{display:'flex',justifyContent:'space-around'}}>
                      {counts.map(({ key, label, color }) => (
                        <div key={key} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                          <span style={{width:7,height:7,borderRadius:'50%',background:color,display:'inline-block'}}/>
                          <span style={{fontSize:9,color:'var(--text3)',fontWeight:500,textAlign:'center'}}>{label}</span>
                        </div>
                      ))}
                    </div>
                  </>
                )}
              </div>
            </div>
          );
        })()}

        {/* Gráfico de pizza (donut): atendimentos por especialista */}
        {(() => {
          const agora = new Date();
          const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1);
          const doMes = atendimentos.filter(a => a.created_at && new Date(a.created_at) >= inicioMes);
          const colors = ['#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ef4444','#0891b2','#ec4899','#14b8a6'];

          const contagem = {};
          doMes.forEach(a => {
            const nome = a.responsavel || a.funcionario_nome || 'Sem especialista';
            contagem[nome] = (contagem[nome]||0)+1;
          });
          if (funcionarios.length > 0) funcionarios.filter(f=>f.ativo).forEach(f => { if(!contagem[f.nome]) contagem[f.nome]=0; });
          const dados = Object.entries(contagem).sort((a,b)=>b[1]-a[1]).filter(([,v])=>v>0);
          const total = dados.reduce((acc,[,v])=>acc+v,0);

          const raio = 55, cx = 65, cy = 65;
          let angulo = -Math.PI / 2;
          const segmentos = dados.map(([nome, val], i) => {
            const perc = total > 0 ? val/total : 0;
            const angFim = angulo + perc * 2 * Math.PI;
            const x1 = cx + raio * Math.cos(angulo);
            const y1 = cy + raio * Math.sin(angulo);
            const x2 = cx + raio * Math.cos(angFim);
            const y2 = cy + raio * Math.sin(angFim);
            const largeArc = perc > 0.5 ? 1 : 0;
            const path = `M ${cx} ${cy} L ${x1} ${y1} A ${raio} ${raio} 0 ${largeArc} 1 ${x2} ${y2} Z`;
            const seg = { nome, val, perc, path, color: colors[i%colors.length] };
            angulo = angFim;
            return seg;
          });

          return (
            <div className="dash-card" style={{margin:0}}>
              <div className="dash-card-header">
                <span className="dash-card-title">Por especialista</span>
                <span style={{fontSize:11,color:'var(--text3)',fontWeight:500}}>{total} total</span>
              </div>
              {total === 0 ? (
                <div style={{textAlign:'center',color:'var(--text3)',fontSize:13,padding:'40px 16px'}}>Nenhum atendimento com especialista</div>
              ) : (
                <div style={{padding:'12px 16px',display:'flex',gap:16,alignItems:'center'}}>
                  <svg width="130" height="130" viewBox="0 0 130 130" style={{flexShrink:0}}>
                    {segmentos.length === 1
                      ? <circle cx={cx} cy={cy} r={raio} fill={segmentos[0].color}/>
                      : segmentos.map((s,i) => <path key={i} d={s.path} fill={s.color} stroke="#fff" strokeWidth="1.5"/>)
                    }
                    <circle cx={cx} cy={cy} r={32} fill="var(--bg2)"/>
                    <text x={cx} y={cy-4} textAnchor="middle" fontSize="18" fontWeight="700" fill="var(--text)" fontFamily="Plus Jakarta Sans">{total}</text>
                    <text x={cx} y={cy+11} textAnchor="middle" fontSize="8" fill="var(--text3)" fontFamily="Plus Jakarta Sans">atendimentos</text>
                  </svg>
                  <div style={{flex:1,minWidth:0}}>
                    {segmentos.map((s,i) => (
                      <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,marginBottom:8}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
                          <span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0,display:'inline-block'}}/>
                          <span style={{fontSize:11,color:'var(--text2)',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.nome}</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                          <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>{s.val}</span>
                          <span style={{fontSize:9,color:'var(--text3)'}}>({Math.round(s.perc*100)}%)</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        })()}

      </div>

      {/* Grid inferior */}
      <div className="dash-bottom">
        {/* Feed de atividades — card e itens clicáveis */}
        <div className="dash-card">
          <div className="dash-card-header">
            <span className="dash-card-title">Atividade recente</span>
            <button className="dash-card-link" onClick={() => setPage('atendimentos')}>Ver todos →</button>
          </div>
          {atendimentos.length === 0 && (
            <div style={{padding:'24px',textAlign:'center',color:'var(--text3)',fontSize:13}}>Nenhum atendimento ainda</div>
          )}
          {atendimentos.slice(0, 5).map(a => {
            const initials = (a.nome || '?').split(' ').map(x=>x[0]).join('').slice(0,2);
            const avatarCls = a.status==='novo'?'blue':a.status==='atendendo'?'warn':'green';
            return (
              <div key={a.id} className="activity-item" style={{cursor:'pointer'}}
                onClick={() => setPage('atendimentos')}
                onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                onMouseLeave={e=>e.currentTarget.style.background=''}>
                <div className={`activity-avatar ${avatarCls}`}>{initials}</div>
                <div className="activity-info">
                  <div className="activity-name">{a.nome}</div>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3,flexWrap:'wrap'}}>
                    <StatusBadge s={a.status} />
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4,flexShrink:0}}>
                  <span className="activity-time">{a.hora}</span>
                </div>
              </div>
            );
          })}
        </div>

        {/* Agenda do dia — card e itens clicáveis */}
        <div className="dash-card">
          <div className="dash-card-header">
            <span className="dash-card-title">
              Agenda de hoje
              {agHoje.length > 0 && (
                <span style={{marginLeft:8,background:'var(--blue-light)',color:'var(--blue)',fontSize:11,fontWeight:700,padding:'1px 7px',borderRadius:99}}>{agHoje.length}</span>
              )}
            </span>
            <button className="dash-card-link" onClick={() => setPage('agenda')}>Ver agenda →</button>
          </div>
          {agHoje.length === 0 ? (
            <div style={{padding:'32px 20px',textAlign:'center',color:'var(--text3)',fontSize:13,cursor:'pointer'}}
              onClick={() => setPage('agenda')}>
              <div style={{fontSize:28,marginBottom:8}}></div>
              Nenhum agendamento para hoje
            </div>
          ) : (
            agHoje.sort((a,b)=>a.hora.localeCompare(b.hora)).map(a => (
              <div key={a.id} className="sched-item" style={{cursor:'pointer'}}
                onClick={() => setPage('agenda')}
                onMouseEnter={e=>e.currentTarget.style.background='var(--bg3)'}
                onMouseLeave={e=>e.currentTarget.style.background=''}>
                <div className="sched-time-box">
                  <div className="sched-time">{a.hora}</div>
                </div>
                <div className="sched-divider" />
                <div className="sched-info" style={{minWidth:0}}>
                  <div className="sched-name" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.nome}</div>
                  <div className="sched-sub" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.telefone}{a.obs ? ` · ${a.obs}` : ''}</div>
                </div>
                <span className={`badge ${a.status==='confirmado'?'badge-finalizado':a.status==='pendente'?'badge-atendendo':'badge-novo'}`} style={{fontSize:11,flexShrink:0}}>
                  {a.status==='confirmado'?'✓':a.status==='pendente'?'⏳':'✗'}
                </span>
              </div>
            ))
          )}

          {/* Rodapé clicável → agenda */}
          <div style={{padding:'12px 20px',borderTop:'1px solid var(--border)',background:'var(--bg3)',display:'flex',gap:16,cursor:'pointer'}}
            onClick={() => setPage('agenda')}
            onMouseEnter={e=>e.currentTarget.style.opacity='.8'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
            {[['Confirmados', agendamentos.filter(x=>x.status==='confirmado').length, 'var(--green-dark)'],
              ['Pendentes', agendamentos.filter(x=>x.status==='pendente').length, 'var(--warn)'],
              ['Cancelados', agendamentos.filter(x=>x.status==='cancelado').length, 'var(--danger)']].map(([l,v,c])=>(
              <div key={l} style={{flex:1,textAlign:'center'}}>
                <div style={{fontSize:16,fontWeight:700,color:c,fontFamily:'Plus Jakarta Sans'}}>{v}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
function StatusBadge({ s }) {
  const map = { novo: ['badge-novo', 'Novo'], atendendo: ['badge-atendendo', 'Em atendimento'], finalizado: ['badge-finalizado', 'Finalizado'] };
  const [cls, label] = map[s] || ['', s];
  const dotCls = { novo: 'dot-novo', atendendo: 'dot-atendendo', finalizado: 'dot-finalizado' }[s];
  return <span className={`badge ${cls}`}><span className={`status-dot ${dotCls}`} />{label}</span>;
}

/* ═══ ATENDIMENTOS — KANBAN ═══ */

  const updateStatus = async (id, novoStatus) => {
    setData(p => p.map(a => a.id === id ? { ...a, status: novoStatus } : a));

    addToast(`Status → ${labels[novoStatus]}`);
    try { await sb.from('atendimentos').update({ status: novoStatus }).eq('id', id); } catch {}

    { id: 'novo',       label: 'Novo',           cor: '#3b82f6', bg: '#eff6ff', dot: 'dot-novo' },

    { id: 'finalizado', label: 'Finalizado',       cor: '#22c55e', bg: '#f0fdf4', dot: 'dot-finalizado' },

  const nextStatus = { novo: 'atendendo', atendendo: 'finalizado', pendente: 'atendendo', agendado: 'finalizado' };

  const initials = (nome) => (nome || '?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();

  return (
    <div>
      {/* Totais */}
      <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
        {colunas.map(c => {
          const count = data.filter(a=>a.status===c.id).length;
          return (
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',borderRadius:99,background:c.bg,border:`1px solid ${c.cor}30`,fontSize:13,fontWeight:500,color:c.cor}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:c.cor,display:'inline-block'}}/>

              <span style={{fontFamily:'Plus Jakarta Sans',fontWeight:700,fontSize:14,color:c.cor}}>{count}</span>

      {/* Board */}
