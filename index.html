        </div>
      ) : (
        <div className="wa-empty">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ccc" strokeWidth="1"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <p style={{fontSize:15,fontWeight:500}}>Selecione uma conversa</p>
          <p style={{fontSize:13}}>Escolha um contato para ver as mensagens</p>
        </div>
      )}
    </div>
  );
}

/* ═══ SUPORTE — CHAT ═══ */
function Suporte({ user, addToast }) {
  const [msgs, setMsgs] = useState([]);
  const [texto, setTexto] = useState('');
  const [loading, setLoading] = useState(true);
  const [enviando, setEnviando] = useState(false);
  const [online, setOnline] = useState(true);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const pendingRef = useRef(new Set()); // rastreia msgs enviadas por mim aguardando Realtime

  const cnpj = user?.cnpj || '';

  /* Carrega histórico */
  const loadMsgs = useCallback(async () => {
    try {
      const { data } = await sb
        .from('suporte_mensagens')
        .select('*')
        .eq('cnpj', cnpj)
        .order('created_at', { ascending: true });
      if (data) setMsgs(data);
    } catch { setOnline(false); }
    setLoading(false);
  }, [cnpj]);

  /* Realtime subscribe */
  useEffect(() => {
    loadMsgs();
    const channel = sb.channel(`suporte:${cnpj}`)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'suporte_mensagens',
        filter: `cnpj=eq.${cnpj}`
      }, payload => {
        const nova = payload.new;
        // Se essa mensagem foi enviada por mim (está no pendingRef), ignora — já está no estado
        if (pendingRef.current.has(nova.mensagem + nova.remetente)) {
          pendingRef.current.delete(nova.mensagem + nova.remetente);
          // Substitui a msg temporária pelo registro real (com id real do banco)
          setMsgs(p => {
            const idx = p.findIndex(m => m._temp && m.mensagem === nova.mensagem && m.remetente === nova.remetente);
            if (idx === -1) return p;
            const updated = [...p];
            updated[idx] = nova;
            return updated;
          });
          return;
        }
        // Mensagem de outra origem (suporte respondendo) — adiciona normalmente
        setMsgs(p => p.some(m => m.id === nova.id) ? p : [...p, nova]);
      })
      .subscribe(status => { setOnline(status === 'SUBSCRIBED'); });
    return () => { sb.removeChannel(channel); };
  }, [cnpj, loadMsgs]);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs]);

  const enviar = async () => {
    const txt = texto.trim();
    if (!txt || enviando) return;
    setTexto('');
    setEnviando(true);

    // Adiciona otimisticamente com flag _temp
    const tempMsg = {
      _temp: true,
      id: `temp_${Date.now()}`,
      cnpj,
      remetente: 'cliente',
      nome_remetente: user?.nome || 'Cliente',
      mensagem: txt,
      created_at: new Date().toISOString(),
    };
    setMsgs(p => [...p, tempMsg]);
    // Registra no pendingRef para o Realtime não duplicar
    pendingRef.current.add(txt + 'cliente');

    try {
      await sb.from('suporte_mensagens').insert([{
        cnpj,
        remetente: 'cliente',
        nome_remetente: user?.nome || 'Cliente',
        mensagem: txt,
      }]);
    } catch {
      // Se falhou, remove a msg temporária e limpa o pending
      setMsgs(p => p.filter(m => m.id !== tempMsg.id));
      pendingRef.current.delete(txt + 'cliente');
      addToast('Erro ao enviar mensagem', 'error');
    }
    setEnviando(false);
    inputRef.current?.focus();
  };

  const [imgPreview, setImgPreview] = useState(null);
  const fileRef = useRef(null);

  const comprimirImagem = (file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(resolve, 'image/jpeg', 0.82);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  const selecionarImagem = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImgPreview({ file, url: URL.createObjectURL(file) });
    e.target.value = '';
  };

  const enviarImagem = async () => {
    if (!imgPreview || enviando) return;
    setEnviando(true);
    try {
      const blob = await comprimirImagem(imgPreview.file);
      const nome = `suporte/${cnpj}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from('Atende+zap').upload(nome, blob, { contentType: 'image/jpeg', upsert: true });
      if (error) throw error;
      const { data: { publicUrl } } = sb.storage.from('Atende+zap').getPublicUrl(nome);
      const tempId = `temp_${Date.now()}`;
      setMsgs(p => [...p, { _temp: true, id: tempId, cnpj, remetente: 'cliente', nome_remetente: user?.nome || 'Cliente', mensagem: '📷 Imagem', midia_url: publicUrl, tipo: 'imagem', created_at: new Date().toISOString() }]);
      setImgPreview(null);
      await sb.from('suporte_mensagens').insert([{ cnpj, remetente: 'cliente', nome_remetente: user?.nome || 'Cliente', mensagem: '📷 Imagem', midia_url: publicUrl, tipo: 'imagem' }]);
    } catch { addToast('Erro ao enviar imagem', 'error'); setImgPreview(null); }
    setEnviando(false);
    inputRef.current?.focus();
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
  };

  const formatTime = (iso) => {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  };

  const formatDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const hoje = new Date();
    const ontem = new Date(); ontem.setDate(ontem.getDate()-1);
    if (d.toDateString() === hoje.toDateString()) return 'Hoje';
    if (d.toDateString() === ontem.toDateString()) return 'Ontem';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
  };

  /* Agrupa por data */
  const msgsPorData = [];
  let lastDate = '';
  msgs.forEach(m => {
    const d = formatDate(m.created_at);
    if (d !== lastDate) { msgsPorData.push({ type: 'divider', label: d }); lastDate = d; }
    msgsPorData.push({ type: 'msg', ...m });
  });

  const renderMensagem = (item) => {
    if (item.tipo === 'imagem' && item.midia_url) {
      return <img src={item.midia_url} className="chat-img-bubble" alt="imagem" onClick={()=>window.open(item.midia_url,'_blank')}/>;
    }
    return <span>{item.mensagem}</span>;
  };

  const initials = (nome) => nome?.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase() || 'S';
  const isMe = (m) => m.remetente === 'cliente';

  return (
    <div className="suporte-layout">
      {/* Sidebar info */}
      <div className="suporte-sidebar">
        <div className="suporte-sidebar-header">
          <h3>Suporte Técnico</h3>
          <p>Atendimento exclusivo para clientes</p>
        </div>

        <div className="suporte-status-item active">
          <div className="suporte-status-avatar">SP</div>
          <div className="suporte-status-info">
            <div className="suporte-status-name">Equipe Atende+Zap</div>
            <div className="suporte-status-preview">
              {msgs.length > 0 ? msgs[msgs.length-1].mensagem : 'Nenhuma mensagem ainda'}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
            {msgs.length > 0 && <span className="suporte-status-time">{formatTime(msgs[msgs.length-1].created_at)}</span>}
          </div>
        </div>

        <div style={{padding:'16px',marginTop:'auto',borderTop:'1px solid var(--border)',background:'var(--bg3)'}}>
          <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em',fontWeight:600}}>Sua conta</div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>{user?.nome}</div>
          <div style={{fontSize:11,color:'var(--text2)',marginTop:2}}>{user?.cnpj}</div>
          <div style={{marginTop:10,display:'flex',alignItems:'center',gap:6}}>
            <span style={{width:7,height:7,borderRadius:'50%',background: online ? 'var(--green)':'var(--danger)',display:'inline-block'}}/>
            <span style={{fontSize:11,color: online ? 'var(--green-dark)':'var(--danger)'}}>{online ? 'Conectado em tempo real' : 'Offline'}</span>
          </div>
        </div>
      </div>

      {/* Área do chat */}
      <div className="chat-area">
        <div className="chat-topbar">
          <div className="chat-topbar-avatar">SP</div>
          <div className="chat-topbar-info">
            <div className="chat-topbar-name">Equipe Atende+Zap</div>
            <div className="chat-topbar-status">
              {online ? '● Online — responde em instantes' : '○ Aguardando conexão...'}
            </div>
          </div>
          <div style={{fontSize:12,color:'var(--text2)',textAlign:'right'}}>
            <div style={{fontWeight:500}}>Seg–Sex</div>
            <div>9h às 18h</div>
          </div>
        </div>

        <div className="chat-messages">
          {loading && (
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,gap:10,color:'var(--text3)',fontSize:13}}>
              <div className="spinner" style={{width:22,height:22,borderWidth:2}}/> Carregando mensagens...
            </div>
          )}

          {!loading && msgs.length === 0 && (
            <div className="chat-empty">
              <IconChat />
              <p style={{fontSize:14,fontWeight:500}}>Nenhuma mensagem ainda</p>
              <p style={{fontSize:13}}>Envie uma mensagem para nossa equipe de suporte</p>
              <div style={{marginTop:20,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:14,padding:'14px 18px',maxWidth:360,textAlign:'left',boxShadow:'var(--shadow-sm)'}}>
                <div style={{fontSize:12,color:'var(--green-dark)',fontWeight:600,marginBottom:6}}>Equipe Atende+Zap</div>
                <div style={{fontSize:13.5,color:'var(--text)',lineHeight:1.6}}>
                  Olá, <strong>{user?.nome}</strong>! 👋<br/>
                  Estamos aqui para ajudar. Como podemos te auxiliar hoje?
                </div>
              </div>
            </div>
          )}

          {!loading && msgsPorData.map((item, i) => {
            if (item.type === 'divider') {
              return <div key={`d${i}`} className="chat-date-divider">{item.label}</div>;
            }
            const mine = isMe(item);
            return (
              <div key={item.id} style={{display:'flex',flexDirection:'column',alignItems: mine ? 'flex-end' : 'flex-start',marginBottom:2}}>
                {/* Nome do remetente (só para mensagens do suporte) */}
                {!mine && <span style={{fontSize:11,color:'var(--text3)',marginLeft:8,marginBottom:2}}>Suporte</span>}
                <div style={{display:'flex',alignItems:'flex-end',gap:6,flexDirection: mine ? 'row-reverse' : 'row'}}>
                  {/* Avatar */}
                  <div style={{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0,background: mine ? 'var(--blue)' : 'var(--green)',marginBottom:4}}>
                    {mine ? initials(user?.nome) : 'SP'}
                  </div>
                  {/* Balão */}
                  <div style={{
                    maxWidth:'85%',padding:'9px 13px',borderRadius:16,fontSize:13.5,lineHeight:1.55,wordBreak:'break-word',
                    background: mine ? 'var(--green)' : 'var(--bg2)',
                    color: mine ? '#fff' : 'var(--text)',
                    border: mine ? 'none' : '1px solid var(--border)',
                    borderBottomRightRadius: mine ? 4 : 16,
                    borderBottomLeftRadius: mine ? 16 : 4,
                    boxShadow: 'var(--shadow-sm)',
                    opacity: item._temp ? 0.7 : 1,
                  }}>
                    {renderMensagem(item)}
                    <div style={{fontSize:10,marginTop:4,textAlign:'right',opacity:.7,color: mine ? 'rgba(255,255,255,0.8)' : 'var(--text3)',display:'flex',alignItems:'center',justifyContent:'flex-end',gap:3}}>
                      {formatTime(item.created_at)}
                      {mine && <span style={{fontSize:12}}>{item._temp ? '⏳' : '✓'}</span>}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef} />
        </div>

        {/* Input */}
        <div className="chat-input-area" style={{flexDirection:'column',gap:8}}>
          {/* Preview da imagem selecionada */}
          {imgPreview && (
            <div className="chat-img-preview">
              <img src={imgPreview.url} alt="preview"/>
              <button className="chat-img-remove" onClick={()=>setImgPreview(null)}>✕</button>
            </div>
          )}
          <div style={{display:'flex',alignItems:'flex-end',gap:10,width:'100%'}}>
            {/* Botão de anexo */}
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={selecionarImagem}/>
            <button className="chat-attach-btn" onClick={()=>fileRef.current?.click()} title="Enviar imagem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <textarea
              ref={inputRef}
              className="chat-input"
              placeholder="Digite sua mensagem... (Enter para enviar)"
              value={texto}
              onChange={e => setTexto(e.target.value)}
              onKeyDown={handleKey}
              rows={1}
              style={{flex:1}}
            />
            <button className="chat-send-btn"
              onClick={imgPreview ? enviarImagem : enviar}
              disabled={(!texto.trim() && !imgPreview) || enviando}
              title="Enviar">
              {enviando
                ? <div style={{width:16,height:16,border:'2px solid rgba(255,255,255,0.3)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  );


}

/* ═══ CONFIGURAÇÕES ═══ */
function Configuracoes({ user, funcionarios, setFuncionarios, categorias, setCategorias, servicos, setServicos, addToast }) {
  const [modalTipo, setModalTipo] = useState(null); // 'funcionarios' | 'categorias' | 'servicos'
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const cnpj = user?.cnpj || '';

  const abrirModal = (tipo, item = null) => { setModalTipo(tipo); setEditItem(item); setShowModal(true); };
  const fecharModal = () => { setShowModal(false); setEditItem(null); setModalTipo(null); };

  /* ── CRUD genérico (recebe o tipo explicitamente) ── */
  const salvar = async (form) => {
    const tipo = modalTipo;
    try {
      if (tipo === 'funcionarios') {
        if (editItem) {
          const { data, error } = await sb.from('funcionarios').update(form).eq('id', editItem.id).select().single();
          if (error) throw error;
          setFuncionarios(p => p.map(f => f.id === editItem.id ? data : f));
        } else {
          const { data, error } = await sb.from('funcionarios').insert([{ ...form, cnpj }]).select().single();
          if (error) throw error;
          setFuncionarios(p => [...p, data]);
        }
        addToast(editItem ? 'Especialista atualizado!' : 'Especialista cadastrado!');
      } else if (tipo === 'categorias') {
        if (editItem) {
          const { data, error } = await sb.from('categorias').update(form).eq('id', editItem.id).select().single();
          if (error) throw error;
          setCategorias(p => p.map(c => c.id === editItem.id ? data : c));
        } else {
          const { data, error } = await sb.from('categorias').insert([{ ...form, cnpj }]).select().single();
          if (error) throw error;
          setCategorias(p => [...p, data]);
        }
        addToast(editItem ? 'Categoria atualizada!' : 'Categoria criada!');
      } else {
        if (editItem) {
          const { data, error } = await sb.from('servicos').update(form).eq('id', editItem.id).select().single();
          if (error) throw error;
          setServicos(p => p.map(s => s.id === editItem.id ? data : s));
        } else {
          const { data, error } = await sb.from('servicos').insert([{ ...form, cnpj }]).select().single();
          if (error) throw error;
          setServicos(p => [...p, data]);
        }
        addToast(editItem ? 'Serviço atualizado!' : 'Serviço criado!');
      }
    } catch (e) { addToast(e.message || 'Erro ao salvar', 'error'); }
    fecharModal();
  };

  const remover = async (tipo, id) => {
    if (!confirm('Remover este item?')) return;
    const tabela = tipo;
    try {
      // Funcionário pode ter agendamentos vinculados (foreign key).
      // Desvincula antes de excluir: os agendamentos continuam existindo, só ficam sem especialista.
      if (tipo === 'funcionarios') {
        const { error: unlinkErr } = await sb.from('agendamentos')
          .update({ funcionario_id: null, funcionario_nome: null })
          .eq('cnpj', cnpj).eq('funcionario_id', id);
        if (unlinkErr) {
          console.error('Erro ao desvincular agendamentos:', unlinkErr);
          addToast('Não foi possível desvincular os agendamentos: ' + (unlinkErr.message || ''), 'error');
          return;
        }
      }
      // Confirma que o banco realmente apagou (delete não lança erro sozinho — retorna em `error`)
      const { error, count } = await sb.from(tabela).delete({ count: 'exact' }).eq('id', id);
      if (error) {
        console.error('Erro ao remover:', error);
        addToast('Não foi possível remover: ' + (error.message || 'permissão negada'), 'error');
        return;
      }
      if (count === 0) {
        addToast('Nada foi removido (registro não encontrado ou sem permissão).', 'error');
        return;
      }
      // Só atualiza a tela depois de confirmar que apagou no banco
      if (tipo === 'funcionarios') setFuncionarios(p => p.filter(f => f.id !== id));
      else if (tipo === 'categorias') setCategorias(p => p.filter(c => c.id !== id));
      else setServicos(p => p.filter(s => s.id !== id));
      addToast('Removido com sucesso.', 'info');
    } catch (e) {
      console.error('Erro ao remover:', e);
      addToast('Erro ao remover', 'error');
    }
  };

  const toggleAtivo = async (func) => {
    try {
      const { data } = await sb.from('funcionarios').update({ ativo: !func.ativo }).eq('id', func.id).select().single();
      setFuncionarios(p => p.map(f => f.id === func.id ? data : f));
      addToast(data.ativo ? 'Especialista ativado!' : 'Especialista desativado.', 'info');
    } catch { addToast('Erro', 'error'); }
  };

  const catNome = (id) => categorias.find(c => c.id === id)?.nome || '—';
  const cores = ['#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ef4444','#0891b2','#ec4899','#14b8a6'];

  // Renderiza uma seção (card com título) para um dos tipos
  const Secao = ({ tipo, titulo, lista, contador, textoNovo, vazio }) => (
    <div className="config-card">
      <div className="config-card-header">
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          <span style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>{titulo}</span>
          <span style={{fontSize:12,color:'var(--text3)'}}>{contador}</span>
        </div>
        <button className="btn-add" style={{fontSize:13,padding:'7px 14px'}} onClick={()=>abrirModal(tipo)}>
          <IconPlus /> {textoNovo}
        </button>
      </div>

      {lista.length === 0 ? (
        <div style={{padding:'28px',textAlign:'center',color:'var(--text3)',fontSize:13}}>{vazio}</div>
      ) : (
        lista.map((item, i) => (
          <div key={item.id} className="config-item">
            <div className="config-item-info">
              <div className="config-avatar" style={{background: tipo==='categorias'?(item.cor||cores[i%cores.length])+'18':'var(--bg3)', color: tipo==='categorias'?(item.cor||cores[i%cores.length]):'var(--text2)', border:'1px solid var(--border)'}}>
                {tipo==='funcionarios' ? (item.nome||'?').slice(0,2).toUpperCase() : tipo==='categorias' ? (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                ) : (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                )}
              </div>
              <div>
                <div className="config-name" style={{fontWeight:500}}>{item.nome}</div>
                <div className="config-sub">
                  {tipo==='funcionarios' && (item.especialidade || 'Sem especialidade')}
                  {tipo==='categorias' && <span style={{background:(item.cor||cores[i%cores.length])+'22',color:item.cor||cores[i%cores.length],padding:'1px 8px',borderRadius:99,fontSize:11,fontWeight:600}}>{item.cor||cores[i%cores.length]}</span>}
                  {tipo==='servicos' && `${item.duracao_min||30} min · Categoria: ${catNome(item.categoria_id)}`}
                </div>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              {tipo==='funcionarios' && (
                <button className="action-btn" style={{fontSize:11,padding:'4px 10px',background:item.ativo?'var(--green-light)':'var(--bg3)',color:item.ativo?'var(--green-dark)':'var(--text2)',borderColor:item.ativo?'var(--green-mid)':undefined}}
                  onClick={()=>toggleAtivo(item)}>
                  {item.ativo?'✓ Ativo':'Inativo'}
                </button>
              )}
              <button className="action-btn" onClick={()=>abrirModal(tipo, item)}>Editar</button>
              <button className="action-btn danger" onClick={()=>remover(tipo, item.id)}><IconTrash /></button>
            </div>
          </div>
        ))
      )}
    </div>
  );

  return (
    <div>
      <div className="config-grid">
        <Secao tipo="funcionarios" titulo="Especialistas" lista={funcionarios}
          contador={`${funcionarios.length} especialista(s)`} textoNovo="Novo especialista" vazio="Nenhum especialista cadastrado" />
        <Secao tipo="categorias" titulo="Categorias" lista={categorias}
          contador={`${categorias.length} categoria(s)`} textoNovo="Nova categoria" vazio="Nenhuma categoria criada" />
        <Secao tipo="servicos" titulo="Serviços" lista={servicos}
          contador={`${servicos.length} serviço(s)`} textoNovo="Novo serviço" vazio="Nenhum serviço cadastrado" />
      </div>

      {/* Modal */}
      {showModal && (
        <div className="modal-overlay" onClick={fecharModal}>
          <div className="modal" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <h3>{editItem?'Editar':'Novo'} {modalTipo==='funcionarios'?'especialista':modalTipo==='categorias'?'categoria':'serviço'}</h3>

            {modalTipo==='funcionarios' && (
              <ConfigFormFuncionario item={editItem} onSave={salvar} onClose={fecharModal}/>
            )}
            {modalTipo==='categorias' && (
              <ConfigFormCategoria item={editItem} onSave={salvar} onClose={fecharModal} cores={cores}/>
            )}
            {modalTipo==='servicos' && (
              <ConfigFormServico item={editItem} onSave={salvar} onClose={fecharModal} categorias={categorias}/>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ConfigFormFuncionario({ item, onSave, onClose }) {
  const [form, setForm] = useState({
    nome: item?.nome||'',
    especialidade: item?.especialidade||'',
    cpf: item?.cpf||'',
    crm: item?.crm||'',
    email: item?.email||'',
    ativo: item?.ativo!==false,
  });
  const up = (k,v) => setForm(p=>({...p,[k]:v}));

  const formatCPF = (v) => {
    const d = v.replace(/\D/g,'').slice(0,11);
    return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  };

  const senhaGerada = form.cpf ? form.cpf.replace(/\D/g,'').slice(0,5) : '—';

  return (
    <>
      <div className="form-grid">
        <div className="form-field"><label>Nome completo</label><input value={form.nome} onChange={e=>up('nome',e.target.value)} placeholder="Dr. João Silva"/></div>
        <div className="form-field"><label>Especialidade / Cargo</label><input value={form.especialidade} onChange={e=>up('especialidade',e.target.value)} placeholder="Clínico Geral, Atendente..."/></div>
      </div>
      <div className="form-grid">
        <div className="form-field">
          <label>CPF</label>
          <input value={form.cpf} onChange={e=>up('cpf',formatCPF(e.target.value))} placeholder="000.000.000-00" inputMode="numeric"/>
        </div>
        <div className="form-field"><label>CRM / Registro</label><input value={form.crm} onChange={e=>up('crm',e.target.value)} placeholder="CRM-SP 123456"/></div>
      </div>
      <div className="form-field"><label>E-mail</label><input type="email" value={form.email} onChange={e=>up('email',e.target.value)} placeholder="funcionario@email.com"/></div>

      {/* Senha gerada automaticamente */}
      {form.cpf && form.cpf.replace(/\D/g,'').length >= 5 && (
        <div style={{background:'var(--green-light)',border:'1px solid var(--green-mid)',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green-dark)" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:'var(--green-dark)'}}>Senha gerada automaticamente</div>
            <div style={{fontSize:12,color:'var(--green-dark)',opacity:.8}}>Login: CPF · Senha: <strong>{senhaGerada}</strong> (5 primeiros dígitos do CPF)</div>
          </div>
        </div>
      )}

      <div className="form-field" style={{display:'flex',alignItems:'center',gap:10}}>
        <input type="checkbox" id="ativo" checked={form.ativo} onChange={e=>up('ativo',e.target.checked)} style={{width:16,height:16}}/>
        <label htmlFor="ativo" style={{fontSize:14,color:'var(--text)',cursor:'pointer',textTransform:'none',letterSpacing:0}}>Especialista ativo</label>
      </div>
      <div className="modal-actions">
        <button className="btn-cancel" onClick={onClose}>Cancelar</button>
        <button className="btn-save" onClick={()=>onSave(form)} disabled={!form.nome.trim()||!form.cpf.trim()}>Salvar</button>
      </div>
    </>
  );
}

function ConfigFormCategoria({ item, onSave, onClose, cores }) {
  const [form, setForm] = useState({ nome: item?.nome||'', cor: item?.cor||'#22c55e' });
  const up = (k,v) => setForm(p=>({...p,[k]:v}));
  return (
    <>
      <div className="form-field"><label>Nome da categoria</label><input value={form.nome} onChange={e=>up('nome',e.target.value)} placeholder="Consulta, Retorno, Exame..."/></div>
      <div className="form-field">
        <label>Cor</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          {cores.map(cor=>(
            <div key={cor} onClick={()=>up('cor',cor)} style={{width:28,height:28,borderRadius:'50%',background:cor,cursor:'pointer',border:form.cor===cor?'3px solid var(--text)':'3px solid transparent',transition:'border .15s'}}/>
          ))}
        </div>
      </div>
      <div className="modal-actions">
        <button className="btn-cancel" onClick={onClose}>Cancelar</button>
        <button className="btn-save" onClick={()=>onSave(form)} disabled={!form.nome.trim()}>Salvar</button>
      </div>
    </>
  );
}

function ConfigFormServico({ item, onSave, onClose, categorias }) {
  const [form, setForm] = useState({ nome: item?.nome||'', duracao_min: item?.duracao_min||30, categoria_id: item?.categoria_id||'' });
  const up = (k,v) => setForm(p=>({...p,[k]:v}));
  return (
    <>
      <div className="form-field"><label>Nome do serviço</label><input value={form.nome} onChange={e=>up('nome',e.target.value)} placeholder="Consulta inicial, Retorno..."/></div>
      <div className="form-row">
        <div className="form-field">
          <label>Duração (minutos)</label>
          <input type="number" value={form.duracao_min} onChange={e=>up('duracao_min',Number(e.target.value))} min={5} max={480}/>
        </div>
        <div className="form-field">
          <label>Categoria</label>
          <select value={form.categoria_id} onChange={e=>up('categoria_id',e.target.value)}>
            <option value="">Sem categoria</option>
            {categorias.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
        </div>
      </div>
      <div className="modal-actions">
        <button className="btn-cancel" onClick={onClose}>Cancelar</button>
        <button className="btn-save" onClick={()=>onSave(form)} disabled={!form.nome.trim()}>Salvar</button>
      </div>
    </>
  );
}

/* ─── Render ─── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
